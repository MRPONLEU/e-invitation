<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB"/>
      <stop offset="30%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#AA7C11"/>
      <stop offset="100%" stop-color="#FFDF00"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Traditional Khmer Kranok Ornament -->
  <g fill="url(#goldGrad)" filter="url(#glow)">
    <path d="M 45 10 C 35 25 20 40 10 55 C 5 62 10 72 20 72 C 30 72 38 62 42 52 C 38 65 30 80 18 92 C 10 100 22 108 32 100 C 45 90 55 70 58 50 C 56 35 52 20 45 10 Z" />
    <path d="M 32 25 C 25 35 15 45 8 52 C 12 55 18 53 22 48 C 28 42 32 32 32 25 Z" />
    <path d="M 52 35 C 48 48 42 62 35 72 C 38 75 44 73 48 66 C 53 58 55 46 52 35 Z" />
  </g>

  <!-- Central Text: ពន្លឺ-បោះពុម្ភ -->
  <g text-anchor="middle" fill="url(#goldGrad)" filter="url(#glow)">
    <text x="250" y="70" font-family="'Moul', 'Moulpali', 'Khmer OS Muol', serif" font-size="38" font-weight="bold" letter-spacing="2">ពន្លឺ-បោះពុម្ភ</text>
    <!-- Underline decoration -->
    <rect x="110" y="86" width="280" height="3" rx="1.5" />
  </g>

  <!-- Right Traditional Khmer Kranok Ornament -->
  <g fill="url(#goldGrad)" filter="url(#glow)">
    <path d="M 455 10 C 465 25 480 40 490 55 C 495 62 490 72 480 72 C 470 72 462 62 458 52 C 462 65 470 80 482 92 C 490 100 478 108 468 100 C 455 90 445 70 442 50 C 444 35 448 20 455 10 Z" />
    <path d="M 468 25 C 475 35 485 45 492 52 C 488 55 482 53 478 48 C 472 42 468 32 468 25 Z" />
    <path d="M 448 35 C 452 48 458 62 465 72 C 462 75 456 73 452 66 C 447 58 445 46 448 35 Z" />
  </g>
</svg>
